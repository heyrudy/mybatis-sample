spring:
  datasource:
    driver-class-name: org.h2.Driver
  liquibase:
    change_log: classpath:db/changelog/db.changelog-hub.xml
    default_schema: PUBLIC
    drop_first: false
    enabled: true
    url: jdbc:h2:file:./data/demodb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    user: SA
    password:
  h2:
    console:
      enabled: true  # Enable H2 console for debugging
      path: /h2-console

logging:
  level:
    liquibase: INFO